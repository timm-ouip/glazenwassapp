project_id = "xsioixuerbwgbzzroyke"

# Versturen mag alleen wie ingelogd is; de functie kijkt zelf welk bedrijf
# daarbij hoort.
[functions.mail-versturen]
verify_jwt = true

# De mailbox koppelen, nu ophalen of ontkoppelen: alleen ingelogd, en de
# functie kijkt zelf of je eigenaar bent.
[functions.mailbox]
verify_jwt = true

# Iets doen met een mail (gelezen, weggooien, versturen): alleen ingelogd, en
# de functie kijkt zelf of je eigenaar bent.
[functions.mail-acties]
verify_jwt = true

# Praten met Paaltje in de app en zijn voorstellen afhandelen: alleen
# ingelogd, en de functie kijkt zelf wat je rol mag.
[functions.paaltje-chat]
verify_jwt = true

# Paaltje kijkt mee bij het importeren van een Excel-lijst: alleen ingelogd,
# en de functie kijkt zelf of je klanten mag bewerken.
[functions.paaltje-import]
verify_jwt = true

# WhatsApp koppelen en beheren: alleen ingelogd, de functie kijkt zelf naar
# de rol en de rechten.
[functions.whatsapp]
verify_jwt = true

# Hier stuurt Meta de WhatsApp-berichten heen. Geen gebruiker; het slot is de
# handtekening met het app-geheim.
[functions.whatsapp-webhook]
verify_jwt = false

# Het dagrapport om half zeven; ook door pg_cron, met dezelfde sleutel.
[functions.dagrapport]
verify_jwt = false

# Paaltje leest wachtende mail; ook door pg_cron, met dezelfde sleutel.
[functions.paaltje-lezen]
verify_jwt = false

# Elke twee minuten aangeroepen door pg_cron, zonder gebruiker. Het slot is de
# kop x-cron-sleutel (MAIL_CRON_SLEUTEL), zie supabase/functions/mail-ophalen.
[functions.mail-ophalen]
verify_jwt = false

# Elke minuut door pg_cron: geplande mail versturen en "altijd naar spam"
# toepassen. Zelfde slot als mail-ophalen (x-cron-sleutel).
[functions.mail-planner]
verify_jwt = false
