<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Figtree:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; font-family: "Figtree", ui-sans-serif, system-ui, sans-serif; }
    a { color: oklch(0.52 0.13 240); text-decoration: none; }
    a:hover { color: oklch(0.44 0.13 240); }
  </style>
</helmet>

<div style="display: flex; width: 1440px; height: 900px; background: oklch(0.972 0.006 240); color: oklch(0.2 0.02 250); overflow: hidden">

  <!-- Zijbalk: brede raakvlakken -->
  <div style="display: flex; flex-direction: column; gap: 22px; width: 250px; flex-shrink: 0; background: oklch(1 0 0); border-right: 1px solid oklch(0.91 0.008 240); padding: 22px 14px">
    <div style="display: flex; align-items: center; gap: 11px; padding: 0 8px">
      <div style="display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 11px; background: oklch(0.52 0.13 240)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="oklch(0.99 0 0)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5S5 13 5 15a7 7 0 0 0 7 7z"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 16.5px; letter-spacing: -0.01em">'t Zonnetje</span>
        <span style="font-size: 11.5px; color: oklch(0.52 0.02 250)">in Huis</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="7">
      <div style="display: flex; align-items: center; gap: 13px; min-height: 46px; padding: 0 12px; border-radius: 10px; background: {{n.bg}}; color: {{n.fg}}; font-size: 15px; font-weight: {{n.gewicht}}">
        <span style="display: block; width: 3px; height: 20px; border-radius: 999px; background: {{n.streep}}"></span>
        <span>{{n.label}}</span>
        <sc-if value="{{n.telling}}" hint-placeholder-val="{{ true }}">
          <span style="margin-left: auto; font-size: 12px; font-weight: 600; color: {{n.tellingFg}}">{{n.telling}}</span>
        </sc-if>
      </div>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; align-items: center; gap: 11px; min-height: 52px; padding: 0 12px; border-radius: 12px; background: oklch(0.965 0.01 240)">
      <div style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 999px; background: oklch(0.52 0.13 240); color: oklch(0.99 0 0); font-weight: 600; font-size: 13px">T</div>
      <div style="display: flex; flex-direction: column">
        <span style="font-size: 13.5px; font-weight: 600">Timm</span>
        <span style="font-size: 11.5px; color: oklch(0.52 0.02 250)">Eigenaar</span>
      </div>
    </div>
  </div>

  <!-- Hoofdgebied -->
  <div style="display: flex; flex-direction: column; flex-grow: 1; min-width: 0">

    <div style="display: flex; align-items: center; gap: 14px; padding: 20px 30px; background: oklch(1 0 0); border-bottom: 1px solid oklch(0.91 0.008 240)">
      <span style="font-family: 'Outfit', sans-serif; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">Madestein</span>
      <span style="font-size: 14px; color: oklch(0.52 0.02 250)">29 straten · 506 klanten</span>

      <div style="display: flex; align-items: center; gap: 9px; margin-left: auto">
        <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 17px; border: 1.5px solid oklch(0.89 0.01 240); border-radius: 10px; background: oklch(1 0 0); font-size: 14.5px; font-weight: 500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.35 0.02 250)" stroke-width="2" stroke-linecap="round"><path d="M9 14 4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>
          <span>Ongedaan</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 17px; border: 1.5px solid oklch(0.89 0.01 240); border-radius: 10px; background: oklch(1 0 0); font-size: 14.5px; font-weight: 500">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.35 0.02 250)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><path d="M6 14h12v8H6z"></path></svg>
          <span>Printlijst</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 19px; border-radius: 10px; background: oklch(0.52 0.13 240); color: oklch(0.99 0 0); font-size: 14.5px; font-weight: 600">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="oklch(0.99 0 0)" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
          <span>Klant toevoegen</span>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px; padding: 22px 30px; flex-grow: 1; min-height: 0">

      <div style="display: flex; align-items: center; gap: 10px">
        <div style="display: flex; gap: 8px">
          <span style="display: flex; align-items: center; height: 40px; padding: 0 20px; border-radius: 10px; background: oklch(0.52 0.13 240); color: oklch(0.99 0 0); font-size: 14.5px; font-weight: 600">Alle maanden</span>
          <span style="display: flex; align-items: center; height: 40px; padding: 0 20px; border-radius: 10px; background: oklch(1 0 0); border: 1.5px solid oklch(0.89 0.01 240); font-size: 14.5px">Even</span>
          <span style="display: flex; align-items: center; height: 40px; padding: 0 20px; border-radius: 10px; background: oklch(1 0 0); border: 1.5px solid oklch(0.89 0.01 240); font-size: 14.5px">Oneven</span>
        </div>
        <div style="display: flex; align-items: center; gap: 9px; margin-left: auto; height: 40px; padding: 0 16px; border-radius: 10px; background: oklch(1 0 0); border: 1.5px solid oklch(0.89 0.01 240)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="oklch(0.52 0.02 250)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
          <span style="font-size: 14.5px; color: oklch(0.52 0.02 250)">Zoek straat of nummer</span>
        </div>
      </div>

      <!-- Straten als brede stroken -->
      <div style="display: flex; flex-direction: column; gap: 14px">
        <sc-for list="{{straten}}" as="s" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; background: oklch(1 0 0); border: 1px solid oklch(0.91 0.008 240); border-radius: 14px; overflow: hidden">
          <div style="display: flex; align-items: center; gap: 14px; min-height: 56px; padding: 0 20px; background: oklch(0.977 0.008 240); border-bottom: 1px solid oklch(0.93 0.008 240)">
            <span style="font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: -0.01em">{{s.naam}}</span>
            <span style="font-size: 13.5px; color: oklch(0.52 0.02 250)">{{s.aantal}} klanten</span>
            <span style="margin-left: auto; font-family: 'Outfit', sans-serif; font-size: 17px; font-weight: 600; color: oklch(0.52 0.13 240)">{{s.omzet}}</span>
          </div>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0">
            <sc-for list="{{s.rijen}}" as="r" hint-placeholder-count="8">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 18px; border-right: 1px solid oklch(0.955 0.006 240); border-bottom: 1px solid oklch(0.955 0.006 240)">
              <span style="font-family: 'Outfit', sans-serif; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 34px">{{r.nr}}</span>
              <span style="font-size: 13.5px; color: oklch(0.5 0.02 250)">{{r.notitie}}</span>
              <span style="margin-left: auto; display: flex; align-items: center; gap: 9px">
                <span style="display: block; width: 9px; height: 9px; border-radius: 999px; background: {{r.stip}}"></span>
                <span style="font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{r.prijs}}</span>
              </span>
            </div>
            </sc-for>
          </div>
        </div>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const uit = { bg: 'transparent', fg: 'oklch(0.32 0.02 250)', streep: 'transparent', gewicht: '500', telling: '', tellingFg: 'oklch(0.52 0.02 250)' };
    const aan = { bg: 'oklch(0.955 0.025 240)', fg: 'oklch(0.35 0.11 240)', streep: 'oklch(0.52 0.13 240)', gewicht: '600', telling: '', tellingFg: 'oklch(0.45 0.11 240)' };
    const elke = 'oklch(0.62 0.14 158)';
    const even = 'oklch(0.68 0.15 55)';
    const oneven = 'oklch(0.78 0.02 250)';
    return {
      nav: [
        { ...aan, label: 'Klanten', telling: '940' },
        { ...uit, label: 'Wijken', telling: '2' },
        { ...uit, label: 'Printen' },
        { ...uit, label: 'Importeren' },
        { ...uit, label: 'Team', telling: '1' },
        { ...uit, label: 'Prullenbak', telling: '12' },
        { ...uit, label: 'Instellingen' },
      ],
      straten: [
        { naam: 'Othilde', aantal: 10, omzet: '€ 310', rijen: [
          { nr: '2', notitie: 'HD', prijs: '€ 28', stip: elke },
          { nr: '3', notitie: 'D', prijs: '€ 31', stip: even },
          { nr: '4', notitie: 'D', prijs: '€ 31', stip: elke },
          { nr: '5', notitie: 'D', prijs: '€ 31', stip: elke },
          { nr: '6', notitie: 'D', prijs: '€ 33', stip: oneven },
          { nr: '7', notitie: 'D', prijs: '€ 33', stip: oneven },
          { nr: '8', notitie: '—', prijs: '€ 26', stip: elke },
          { nr: '11', notitie: 'D+sd', prijs: '€ 33', stip: even },
        ]},
        { naam: 'Karel Stoute', aantal: 16, omzet: '€ 435', rijen: [
          { nr: '4', notitie: '—', prijs: '€ 40', stip: even },
          { nr: '8', notitie: '3,6,9,12', prijs: '€ 32', stip: elke },
          { nr: '10', notitie: '3,6,9,12', prijs: '€ 32', stip: elke },
          { nr: '12', notitie: 'Dak apr', prijs: '€ 35', stip: elke },
          { nr: '18', notitie: 'VHZ', prijs: '€ 18', stip: even },
          { nr: '20', notitie: 'D', prijs: '€ 35', stip: even },
          { nr: '23', notitie: 'DD', prijs: '€ 30', stip: oneven },
          { nr: '25', notitie: '—', prijs: '€ 25', stip: oneven },
        ]},
        { naam: 'Karel V Park', aantal: 12, omzet: '€ 367,50', rijen: [
          { nr: '4', notitie: '—', prijs: '€ 35', stip: oneven },
          { nr: '5', notitie: 'H+SD', prijs: '€ 50', stip: elke },
          { nr: '7', notitie: 'H+vx', prijs: '€ 27,50', stip: elke },
          { nr: '10', notitie: '—', prijs: '€ 35', stip: elke },
          { nr: '14', notitie: '—', prijs: '€ 32,50', stip: oneven },
          { nr: '16', notitie: '—', prijs: '€ 25', stip: oneven },
          { nr: '20', notitie: '—', prijs: '€ 27,50', stip: oneven },
          { nr: '17', notitie: '—', prijs: '€ 25', stip: oneven },
        ]},
      ],
    };
  }
}
</script>
</body>
</html>
